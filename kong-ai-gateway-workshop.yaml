      isPrivate: false
      description: >-
        # 1. Setup Key Authentication Policy


        Before proceeding with AI Governance, secure your AI Model with API
        Keys. In Kong AI Gateway 2.0, policies are attached directly to the AI
        Model entity.


        1. Navigate to your my-model AI Model in the Konnect UI.

        2. Open the Access tab and click Add auth strategy.

        3. give a Diplay Name say Key-Auth Leave the default settings (Header
        name: apikey). Click add

        4. Go to Consumers tab in AI gateway in the left menu, create a new
        consumer of type API Key, Give Display Name and Consumer Id as and click
        Next ai-developer.

        5. Under the consumer's credentials tab, generate a new API Key or type
        it in, click Create Key (e.g., my-secret-key).


        ## Testing Script

        ```

        curl -X POST "$KONNECT_PROXY_URL/v1/chat/completions" \
          -H "apikey: my-secret-key" \
          -H "Content-Type: application/json" \
          --json '{
            "messages": [{"role": "user", "content": "Are you secure?"}],
            "model": "my-model"
          }'
        ```
      sortKey: -1790844715375
