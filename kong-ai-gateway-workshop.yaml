  - name: 2. AI Rate Limiting Advanced Policy
    meta:
      id: fld_7bc99c3b3d4844a49aa974bfa8b25e4f
      created: 1790911672085
      modified: 1790936029448
      sortKey: -1790844715359.375
      description: >-
        # 2. AI Rate Limiting Advanced Policy


        The AI Rate Limiting Advanced policy restricts traffic based on the
        total number of LLM tokens processed, allowing you to control true
        financial costs rather than just HTTP requests.


        1. Navigate to your AI Model (my-model) and open the Policies tab.

        2. Add the AI Rate Limiting Advanced policy. in Policies , add Limit

        3. Set the Strategy to local (for testing purposes).

        4. Under limits, specify a very low token limit for testing: [ {
        "limit": 200, "window_size": 60 } ] keep other default settings .

        5. Ensure the Tokens count strategy is explicitly set to total_okens
        click Save and Next.

        6. Click add entiry set your model name my-model done


        Policies:

        ```

        [
          {
            "id": null,
            "limits": [
              {
                "limit": 200,
                "month_day": null,
                "period": null,
                "tokens_count_strategy": "total_tokens",
                "week_start_day": null,
                "window_size": 60
              }
            ],
            "match": null,
            "timezone": null,
            "window_type": "sliding"
          }
        ]

        ```


        ## Testing Command Line:

        ```

        for i in {1..5}; do
          echo "Request $i:"
          curl -i -s -X POST "$KONNECT_PROXY_URL/v1/chat/completions" \
            -H "apikey: my-secret-key" \
            -H "Content-Type: application/json" \
            --json '{
              "messages": [{"role": "user", "content": "Write a long story about API Gateways."}],
              "model": "my-model"
            }' | head -n 15
          echo -e "\n----------------------------------------\n"
        done

        ```


        ## Testing on Insomnia, Click "Run Folder" to simulate rate limite error
