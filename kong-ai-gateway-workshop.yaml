        # 5. Semantic Routing Policy (deprecated)


        Intelligently route traffic between different LLMs based on the context
        of the user's prompt to optimize for cost or performance.


        1. Ensure you have both an OpenAI AI Provider and a Mistral AI Provider
        configured in Konnect.

        2. On an overarching AI Model acting as your router, attach the AI
        Semantic Routing policy.

        3. Configure routing rules mapping semantic intent to specific
        underlying providers:
            * Route "Conversational chat or creative writing" to your generic-openai provider.
            * Route "Data extraction and strict JSON parsing" to your mistral-provider.

        ## New Method: Load Balancing

        1. Navigate to the "Models" tab of your gateway.

        2. Go to you model name that you setup in Step 0.

        3. Go to "Target models", Click "Edit" on menu "Load Balancing".

        4. Choose "Semantic Routing" under "Algorithm".

        5. Configure routing rules mapping semantic intent to specific
        underlying models:
            * Semantic description: "Conversational chat or creative writing" to your `open-ai - gpt-4o`.
            * Semantic description: "Data extraction and strict JSON parsing" to your `mistral-ai - ministral-3b-2512`.
            * Semantic description: "CATCHALL" to your `open-ai - gpt-3.5-turbo`.
        6. configure embedding provider and redis as in step 3.

        7. Set "Caching similarity threshold" to 0.7

