      - url: "{{ _.base_url }}/v1/chat/completions"
        name: 7.6. Run Workflow (2. Execute MCP & Final Answer)
        meta:
          id: req_ffdad9c60cfa45f7bcd4661a5228f7ba
          created: 1791278512874
          modified: 1791297419948
          isPrivate: false
          description: >-
            ### 7.6. Run Workflow (2. Execute MCP & Final Answer)


            ##### Pre-Request Script:

            ```

            // Helper function to safely parse SSE or standard JSON from MCP
            Gateway

            function parseMcpPayload(rawHttpText) {
              const cleanText = (rawHttpText || '').trim();
              if (!cleanText) {
                throw new Error("Received empty payload from MCP Gateway.");
              }

              // Handle SSE format safely (event: message \n data: {...})
              if (cleanText.includes("data:")) {
                const sseLine = cleanText
                  .split('\n')
                  .find(line => line.trim().startsWith('data:'));

                if (!sseLine) {
                  throw new Error("Could not extract 'data:' line from SSE stream.");
                }

                const payloadJson = sseLine.replace(/^data:\s*/, '').trim();
                return JSON.parse(payloadJson);
              }

              return JSON.parse(cleanText);
            }


            // 1. Retrieve and parse previous LLM assistant response

            const rawPrevResponse =
            insomnia.environment.get("prev_assistant_response");

            if (!rawPrevResponse) {
              throw new Error("Missing 'prev_assistant_response' in environment variables.");
            }


            const parsedPrevResponse = JSON.parse(rawPrevResponse);

            const rawAssistantChoice = parsedPrevResponse.choices[0].message;


            // Clean assistant message to meet strict OpenAI schema

            const cleanAssistantMessage = {
              role: "assistant",
              content: rawAssistantChoice.content || null
            };


            if (rawAssistantChoice.tool_calls) {
              cleanAssistantMessage.tool_calls = rawAssistantChoice.tool_calls;
            }


            // 2. Execute MCP tool call if required

            if (rawAssistantChoice.tool_calls &&
            rawAssistantChoice.tool_calls.length > 0) {
              const primaryToolCall = rawAssistantChoice.tool_calls[0];
              const targetToolName = primaryToolCall.function.name;
              
              const parsedArguments = typeof primaryToolCall.function.arguments === 'string'
                ? JSON.parse(primaryToolCall.function.arguments)
                : primaryToolCall.function.arguments;

              const mcpCallPayload = {
                jsonrpc: "2.0",
                id: 5,
                method: "tools/call",
                params: {
                  name: targetToolName,
                  arguments: parsedArguments
                }
              };

              const targetGatewayUrl = insomnia.environment.get('MCP_GATEWAY_URL');

              // Send request to MCP Gateway
              const mcpHttpResponse = await new Promise((resolve, reject) => {
                insomnia.sendRequest(
                  {
                    url: targetGatewayUrl,
                    method: 'POST',
                    header: { 
                      'Content-Type': 'application/json',
                      'Accept': 'text/event-stream, application/json',
                      'Mcp-Session-Id': insomnia.environment.get('Mcp-Session-Id') || ''
                    },
                    body: { mode: 'raw', raw: JSON.stringify(mcpCallPayload) }
                  },
                  (err, result) => (err ? reject(err) : resolve(result))
                );
              });

              // Extract raw body using bracket notation to protect against Insomnia auto-replacements
              const gatewayOutput = mcpHttpResponse['body'];
              const mcpData = parseMcpPayload(gatewayOutput);

              // Extract text output from MCP response
              let extractedTextOutput = "";
              if (mcpData.result && mcpData.result.content) {
                extractedTextOutput = mcpData.result.content
                  .filter(item => item.type === 'text')
                  .map(item => item.text)
                  .join("\n");
              } else if (mcpData.result) {
                extractedTextOutput = JSON.stringify(mcpData.result);
              }

              // --- TRUNCATE TO SAVES TOKENS ---
              // Limit output to ~500 characters to avoid exceeding AI Gateway TPM limits
              if (extractedTextOutput.length > 500) {
                extractedTextOutput = extractedTextOutput.substring(0, 500) + "\n...[truncated]";
              }

              // 3. Construct complete conversation history
              const fullConversation = [
                { role: "user", content: "Check the weather in Tokyo." },
