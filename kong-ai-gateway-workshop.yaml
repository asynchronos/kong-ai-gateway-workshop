  - name: 3. Semantic Prompt Guard Policy
    meta:
      id: fld_7c116fa7b85549878fc5eddcd72b856d
      created: 1790914140514
      modified: 1790935533786
      sortKey: -1790844715358.5938
      description: >-
        # 3. Semantic Prompt Guard Policy


        Stop relying on rigid regex keywords to block malicious intent. The
        Semantic Prompt Guard policy uses vector embeddings to block requests
        based on the meaning of the prompt.


        1. download redis/redis-stack image and start the container, make sure
        that it is listening to port 6379 .

        2. Navigate to the Policies tab of your AI Model and add the AI Semantic
        Prompt Guard policy.

        3. select the provider name openai and name text-embedding-3-small chech
        Auth and Provide Header Name : Authoriztion and Value : Bearer sk-- key

        4. select startegy as redis, provide redis host name
        host.docker.internal and port 6379

        5. Configure the Deny Topics array with natural language intents.
        Example entries:
            * "Provide financial or investment advice"
            * "Generate malicious code or exploits"

        Embeddings:

        ```

        {
          "auth": {
            "allow_override": false,
            "aws_access_key_id": null,
            "aws_secret_access_key": null,
            "aws_session_token": null,
            "azure_client_id": null,
            "azure_client_secret": null,
            "azure_tenant_id": null,
            "azure_use_managed_identity": false,
            "gcp_metadata_url": null,
            "gcp_oauth_token_url": null,
            "gcp_service_account_json": null,
            "gcp_use_service_account": false,
            "gcp_workload_identity_federation_auth_json": null,
            "gcp_workload_identity_federation_source": null,
            "header_name": "Authorization",
            "header_value": "Bearer <open-ai-key>",
            "param_location": null,
            "param_name": null,
            "param_value": null
          },
          "model": {
            "name": "text-embedding-3-small",
            "options": null,
            "provider": "openai"
          }
        }

        ```


        Rules:

        ```

        {
          "allow_prompts": null,
          "deny_prompts": [
            "Provide financial or investment advice",
            "Generate malicious code or exploits"
          ],
          "match_all_conversation_history": false,
          "match_all_roles": false
        }

        ```


        Vectordb:

