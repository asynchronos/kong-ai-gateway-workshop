      description: >-
        # 4. Semantic Caching Policy


        Serve responses instantly for functionally identical prompts by
        evaluating vector embeddings. If a user asks "What is Kong?" and later
        asks "Explain Kong to me", the gateway serves the cached response.


        1. Navigate to the Policies tab of your AI Model and add the AI Semantic
        Caching policy.

        2. configure embedding provider and redis as in step 3

        3. Set the disance metric to Cosine and threshhold to 0.3.



