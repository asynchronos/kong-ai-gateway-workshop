    children:
      - url: "{{ _.base_url }}/weather"
        name: 7.1. MCP Server Setup & Opening Session
        meta:
          id: req_a31a5addcc514ea08ad6748f775cfbdb
          created: 1791181345685
          modified: 1791297879584
          isPrivate: false
          description: |-
            ## 7.1. MCP Server Setup

            Map an API to a Model Context Protocol (MCP) Tool to proxy MCP server traffic securely through the AI Gateway.

            `Note: You must first define an MCP Server entity in Kong Konnect to expose your internal APIs as secure, observable tools that LLMs and AI Agents can consume dynamically.`

            1. Navigate to the MCP Servers tab in your Konnect AI Gateway dashboard.
            2. Click New MCP Server. Give it a displau name (e.g., weather-mcp).
            3. Select Conversion-Listener, Define the upstream URL of your MCP-compliant service. https://api.weatherapi.com/v1/current.json
            4. Uncheck "Forward client headers.
            5. Expand "Advanced fields" then Check "Managed session" with Redis (same as previous setup). Click "Next"
            6. Set Route: base path "/weather". Click "Next"
            7. Select "ACL attribute type" as "Consumer". Click "Next".
            8. click add tool, then set:
            	- Name: get-current-weather
            	- Description: Get current weather for a location
            	- Path: /weather 
            	- Method GET
            	- Add query parameter:  
            			`Name=key`  
            			`Value=weather-api-key`
            	- Parameters:  
            		```
            		[
            			{
            				"description": "Location query. Accepts US Zipcode, UK Postcode, Canada Postalcode, IP address, latitude/longitude, or city name.",
            				"in": "query",
            				"name": "q",
            				"required": true,
            				"schema": {
            					"type": "string"
            				}
            			}
            		]
            		```
            9. Click "Save".
            		
            ### Open a session

            Send an initialize request to the route configured on the MCP Server (/weather), capturing the Mcp-Session-Id response header into an environment variable

            ```
            SESSION_ID=$(curl -i -X POST "$KONNECT_PROXY_URL/weather/" \
