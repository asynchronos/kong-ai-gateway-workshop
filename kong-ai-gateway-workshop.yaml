  - url: "{{ _.base_url }}/v1/chat/completions"
    name: 0. AI Gateway Quick Start
    meta:
      id: req_b0304dd0fb4f47a7add6313dccdb7a0e
      created: 1790909895222
      modified: 1790929879503
      isPrivate: false
      description: >-
        # 0. AI Gateway Quick Start

        https://kong-shubham.github.io/kong-ai-gateway-workshop/


        ## Prerequisites & Setup


        KONNECT_TOKEN: {{ _.KONNECT_TOKEN }}


        apikey: your-api-key


        ```

        export KONNECT_TOKEN='{{ _.KONNECT_TOKEN }}'


        export AI_GATEWAY_ID=your-ai-gateway-id

        export KONNECT_TOKEN=$KONNECT_TOKEN

        export KONNECT_CONTROL_PLANE_NAME=your-control-plane

        export KONNECT_CONTROL_PLANE_URL=https://us.api.konghq.com

        export KONNECT_PROXY_URL='http://localhost:8000'


        export OPENAI_API_KEY='{{ _.OPENAI_API_KEY }}'

        export OPENAI_AUTH_HEADER="Bearer $OPENAI_API_KEY"

        ```


        ## Generate & Run the data plane node with Docker


        ```

        docker run -d `

        -e "KONG_ROLE=data_plane" `

        -e "KONG_DATABASE=off" `

        -e "KONG_VITALS=off" `

        -e "KONG_CLUSTER_MTLS=pki" `

        -e "KONG_CLUSTER_CONTROL_PLANE=ab8f96dcd7.us.cp.konghq.com:443" `

        -e "KONG_CLUSTER_SERVER_NAME=ab8f96dcd7.us.cp.konghq.com" `

        -e "KONG_CLUSTER_TELEMETRY_ENDPOINT=ab8f96dcd7.us.tp.konghq.com:443" `

        -e "KONG_CLUSTER_TELEMETRY_SERVER_NAME=ab8f96dcd7.us.tp.konghq.com" `

        -e "KONG_CLUSTER_CERT=[removed: certificate or private key]" `

        -e "KONG_CLUSTER_CERT_KEY=[removed: certificate or private key]" `

        -e "KONG_LUA_SSL_TRUSTED_CERTIFICATE=system" `

        -e "KONG_KONNECT_MODE=on" `

        -p 8000:8000 `

        -p 8443:8443 `

        kong/kong-ai-gateway:2.2.0-distroless

        ```


        ## Create Model for serving


        1. Go to your "AI Gateway" panel in Kong.

        2. Click tab "Providers" then "New Provider".

        3. Create 2 Provider, OpenAI and Mistral.

        4. Click tab "Models" then "New" model. Set Display name "my-model".

        5. Add 3 model in "Target Models". openai:gpt-3.5-turbo, openai:gpt-4o,
        mistral:ministral-3b-2512.


        ## Testing Script

        ```

        curl -X POST "$KONNECT_PROXY_URL/v1/chat/completions" \
          -H "Content-Type: application/json" \
          --json '{
            "messages": [
              {
                "role": "user",
                "content": "Hello Kong!"
              }
            ],
            "model": "my-model"
          }'
        ```
