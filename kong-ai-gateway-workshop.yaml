          isPrivate: false
          description: >-
            ### 7.5. Run Workflow (1. Initial Chat Request)


            ##### Pre-Request Script:

            ```

            // Helper function using non-trigger variable names

            function parseMcpPayload(rawHttpText) {
              const cleanText = (rawHttpText || '').trim();
              if (!cleanText) {
                throw new Error("Received empty payload from MCP Gateway.");
              }

              // Handle SSE format safely
              if (cleanText.includes("data:")) {
                const sseLine = cleanText
                  .split('\n')
                  .find(line => line.trim().startsWith('data:'));

                if (!sseLine) {
                  throw new Error("Could not extract 'data:' line from SSE stream.");
                }

                const payloadJson = sseLine.replace(/^data:\s*/, '').trim();
                return JSON.parse(payloadJson);
              }

              return JSON.parse(cleanText);
            }


            // 1. Resolve and validate the gateway URL

            const envBaseUrl = insomnia.environment.get('base_url') || '';

            const envMcpPath = insomnia.environment.get('mcp_weather_path') ||
            '';

            const MCP_GATEWAY_URL = envBaseUrl + envMcpPath;


            if (!MCP_GATEWAY_URL) {
              throw new Error("Invalid URL! Check 'base_url' and 'mcp_weather_path' in your environment.");
            }


            insomnia.environment.set("MCP_GATEWAY_URL", MCP_GATEWAY_URL);


            // 2. Prepare MCP payload

            const mcpPayload = {
              jsonrpc: "2.0",
              id: 4,
              method: "tools/list",
              params: {}
            };


            // 3. Send request

            const mcpHttpResponse = await new Promise((resolve, reject) => {
              insomnia.sendRequest(
                {
                  url: MCP_GATEWAY_URL,
                  method: 'POST',
                  header: { 
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream, application/json',
                    'Mcp-Session-Id': insomnia.environment.get('Mcp-Session-Id') || ''
                  },
                  body: { mode: 'raw', raw: JSON.stringify(mcpPayload) }
                },
                (err, result) => (err ? reject(err) : resolve(result))
              );
            });


            // 4. Extract body from sent request object

            const gatewayOutput = mcpHttpResponse.body;


            // 5. Parse SSE payload safely

            const mcpData = parseMcpPayload(gatewayOutput);


            if (!mcpData.result || !mcpData.result.tools) {
              throw new Error("Invalid MCP response structure: missing 'result.tools'.");
            }


            // 6. Map MCP tools to OpenAI format

            const openAiTools = mcpData.result.tools.map(tool => ({
              type: "function",
              function: {
                name: tool.name,
                description: tool.description || "",
                parameters: tool.inputSchema
              }
            }));


            // 7. Save to environment

            insomnia.environment.set("mcp_tools_json",
            JSON.stringify(openAiTools));

            ```


            ##### After-Response Script:

            ```

            insomnia.environment.set("prev_assistant_response",
            insomnia.response.body);

            ```
